<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedlayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f6f4;
        --paper: #ffffff;
        --ink: #16151a;
        --muted: #6b6872;
        --line: #e6e3df;
        --accent: #9a3412;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121114;
          --paper: #1c1b20;
          --ink: #f4f2ef;
          --muted: #a39eaa;
          --line: #2e2c33;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 24px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .logo {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: linear-gradient(
          145deg,
          var(--accent),
          color-mix(in srgb, var(--accent) 42%, white)
        );
      }

      .project {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .project input {
        width: 168px;
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 10px;
        padding: 8px 12px;
      }

      .project input[aria-invalid="true"] {
        border-color: #9f2d2d;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 24px 72px;
      }

      .error {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding: 10px 12px 10px 14px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14px;
      }

      .error[hidden] {
        display: none;
      }

      .error button {
        flex: none;
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 999px;
        padding: 6px 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 36px;
        align-items: start;
      }

      .settings,
      .preview,
      .panel,
      .stage {
        min-width: 0;
      }

      .settings {
        display: grid;
        gap: 32px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        min-height: 108px;
        padding: 12px;
        text-align: left;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .card strong {
        font-size: 14px;
        font-weight: 600;
      }

      .card span,
      .desc {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .card[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .swatches {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }

      .swatches i {
        display: block;
        width: 16px;
        height: 16px;
        border-radius: 999px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 999px;
        padding: 8px 14px;
      }

      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }

      .preview {
        position: sticky;
        top: 76px;
      }

      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .stage {
        padding: 22px;
        border: 1px solid transparent;
      }

      .stage-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        opacity: 0.72;
      }

      .stage h3 {
        margin: 18px 0 8px;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: -0.03em;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .stage p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        max-width: 34em;
      }

      .stage-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .stage-actions span {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 500;
      }

      .command {
        margin: 14px 0 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #16151a;
        color: #f3f1ee;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        max-width: 100%;
      }

      .copy {
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        padding: 12px 16px;
        font-weight: 600;
      }

      .copy:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .preview {
          position: static;
          order: -1;
        }

        header {
          align-items: flex-start;
        }
      }

      @media (max-width: 640px) {
        header {
          flex-wrap: wrap;
        }

        .project {
          width: 100%;
        }

        .project input {
          flex: 1;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        Seedlayer
      </div>
      <label class="project">
        Project
        <input
          id="name"
          value="my-app"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          aria-label="Project name"
        />
      </label>
    </header>

    <div class="wrap">
      <div id="error" class="error" role="alert" hidden>
        <span>Use a lowercase name like my-app.</span>
        <button type="button" id="fix">Use “my-app”</button>
      </div>

      <div class="grid">
        <div class="settings" id="settings">
          <section>
            <h2>Preset</h2>
            <div class="cards" id="presets"></div>
          </section>
          <section>
            <h2>Palette</h2>
            <div class="cards" id="palettes"></div>
          </section>
          <section>
            <h2>Radius</h2>
            <div class="chips" id="radii" role="group" aria-label="Radius"></div>
          </section>
          <section>
            <h2>Font</h2>
            <div class="chips" id="fonts" role="group" aria-label="Font"></div>
          </section>
          <section>
            <h2>Standards</h2>
            <div class="chips" id="linters" role="group" aria-label="Standards"></div>
          </section>
          <section>
            <h2>Git</h2>
            <div class="chips" id="gits" role="group" aria-label="Git"></div>
          </section>
          <section>
            <h2>Agents</h2>
            <div class="chips" id="agents" role="group" aria-label="Agents"></div>
          </section>
        </div>

        <aside class="preview">
          <div class="panel">
            <div class="stage" id="stage">
              <div class="stage-top">
                <strong id="stage-name">my-app</strong>
                <span>Dashboard</span>
              </div>
              <h3>Ship the context with the app.</h3>
              <p>This card uses your palette, radius and font live.</p>
              <div class="stage-actions">
                <span id="primary">Primary</span>
                <span id="highlight">Highlight</span>
                <span id="surface">Surface</span>
              </div>
            </div>
            <pre class="command" id="command"></pre>
            <button type="button" class="copy" id="copy">Copy command</button>
            <div class="meta">
              <span id="summary"></span>
              <span>61 files</span>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const PALETTES = [
        {
          id: "ink",
          label: "Ink",
          detail: "Warm paper, copper and amber.",
          bg: "#f6f1e7",
          fg: "#1c140e",
          accent: "#9a3412",
          accentFg: "#fff7ed",
          highlight: "#b45309",
          highlightFg: "#fffbeb",
          danger: "#b42318",
        },
        {
          id: "harbor",
          label: "Harbor",
          detail: "Mist page, cobalt and teal.",
          bg: "#f2f6fc",
          fg: "#102033",
          accent: "#1d4ed8",
          accentFg: "#eff6ff",
          highlight: "#0f766e",
          highlightFg: "#f0fdfa",
          danger: "#be123c",
        },
        {
          id: "ember",
          label: "Ember",
          detail: "Cream page, rose and orange.",
          bg: "#fff5ef",
          fg: "#2a140f",
          accent: "#be123c",
          accentFg: "#fff1f2",
          highlight: "#c2410c",
          highlightFg: "#fff7ed",
          danger: "#9f1239",
        },
        {
          id: "iris",
          label: "Iris",
          detail: "Lilac page, violet and pink.",
          bg: "#f5f3fb",
          fg: "#1c1530",
          accent: "#6d28d9",
          accentFg: "#f5f3ff",
          highlight: "#be185d",
          highlightFg: "#fdf2f8",
          danger: "#be123c",
        },
        {
          id: "grove",
          label: "Grove",
          detail: "Sage page, emerald and gold.",
          bg: "#f1f7f3",
          fg: "#102117",
          accent: "#047857",
          accentFg: "#ecfdf5",
          highlight: "#a16207",
          highlightFg: "#fefce8",
          danger: "#c2410c",
        },
        {
          id: "dusk",
          label: "Dusk",
          detail: "Blush page, wine and violet.",
          bg: "#f8f3f6",
          fg: "#24141c",
          accent: "#9d174d",
          accentFg: "#fff1f5",
          highlight: "#6d28d9",
          highlightFg: "#f5f3ff",
          danger: "#b91c1c",
        },
      ];

      const PRESETS = {
        "startup-speed": {
          label: "Startup speed",
          detail: "Agent-safe branches, Biome, every gate.",
          palette: "ink",
          radius: 8,
          font: "Inter",
          linter: "biome",
          git: "agent-safe",
          agents: ["cursor", "claude-code"],
        },
        "team-strict": {
          label: "Team strict",
          detail: "GitHub Flow, ESLint, 200-line files.",
          palette: "harbor",
          radius: 4,
          font: "Geist",
          linter: "eslint",
          git: "github-flow",
          agents: ["cursor", "claude-code"],
        },
        "hackathon-2h": {
          label: "Hackathon",
          detail: "Trunk-based, grove palette, Cursor only.",
          palette: "grove",
          radius: 12,
          font: "Geist",
          linter: "biome",
          git: "trunk",
          agents: ["cursor"],
        },
      };

      const RADII = [
        { value: 0, label: "0" },
        { value: 4, label: "4px" },
        { value: 8, label: "8px" },
        { value: 12, label: "12px" },
      ];
      const FONTS = [
        { value: "Inter", label: "Inter" },
        { value: "Geist", label: "Geist" },
        { value: "system", label: "System" },
      ];
      const LINTERS = [
        { value: "biome", label: "Biome" },
        { value: "eslint", label: "ESLint" },
      ];
      const GITS = [
        { value: "trunk", label: "Trunk" },
        { value: "github-flow", label: "GitHub Flow" },
        { value: "agent-safe", label: "Agent-safe" },
      ];
      const AGENTS = [
        { value: "cursor", label: "Cursor" },
        { value: "claude-code", label: "Claude Code" },
      ];

      const state = {
        preset: "startup-speed",
        palette: "ink",
        radius: 8,
        font: "Inter",
        linter: "biome",
        git: "agent-safe",
        agents: ["cursor", "claude-code"],
        name: "my-app",
      };

      const nameInput = document.querySelector("#name");
      const errorBar = document.querySelector("#error");
      const fixButton = document.querySelector("#fix");
      const copyButton = document.querySelector("#copy");
      let copiedTimer = 0;

      function suggest(value) {
        const slug = value
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
        return slug || "my-app";
      }

      function nameError(value) {
        return /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(value) ? "" : "invalid";
      }

      function encodeSettings() {
        const json = JSON.stringify({
          agents: state.agents,
          font: state.font,
          git: state.git,
          linter: state.linter,
          palette: state.palette,
          preset: state.preset,
          radius: state.radius,
        });
        const bytes = new TextEncoder().encode(json);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      function command() {
        return `npx create-seedlayer ${state.name} --config ${encodeSettings()}`;
      }

      function labelOf(list, value) {
        return list.find((item) => item.value === value)?.label ?? value;
      }

      function mountChips(parent, list, key) {
        parent.replaceChildren(
          ...list.map((item) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "chip";
            button.textContent = item.label;
            button.dataset[key] = String(item.value);
            button.setAttribute("aria-pressed", "false");
            return button;
          }),
        );
      }

      function pressChips(parent, key, pressed) {
        for (const button of parent.querySelectorAll("button")) {
          button.setAttribute("aria-pressed", pressed(button.dataset[key]) ? "true" : "false");
        }
      }

      function paint() {
        const palette = PALETTES.find((item) => item.id === state.palette) ?? PALETTES[0];
        document.documentElement.style.setProperty("--accent", palette.accent);

        for (const button of document.querySelectorAll("#presets button")) {
          button.setAttribute("aria-pressed", button.dataset.preset === state.preset ? "true" : "false");
        }
        for (const button of document.querySelectorAll("#palettes button")) {
          button.setAttribute("aria-pressed", button.dataset.palette === state.palette ? "true" : "false");
        }
        pressChips(document.querySelector("#radii"), "radius", (value) => Number(value) === state.radius);
        pressChips(document.querySelector("#fonts"), "font", (value) => value === state.font);
        pressChips(document.querySelector("#linters"), "linter", (value) => value === state.linter);
        pressChips(document.querySelector("#gits"), "git", (value) => value === state.git);
        pressChips(document.querySelector("#agents"), "agent", (value) => state.agents.includes(value));

        const stage = document.querySelector("#stage");
        const radius = `${state.radius}px`;
        const family =
          state.font === "system"
            ? "ui-sans-serif, system-ui, sans-serif"
            : `${state.font}, ui-sans-serif, system-ui, sans-serif`;
        stage.style.background = palette.bg;
        stage.style.color = palette.fg;
        stage.style.borderRadius = radius;
        stage.style.fontFamily = family;
        document.querySelector("#stage-name").textContent = state.name || "my-app";
        const primary = document.querySelector("#primary");
        const highlight = document.querySelector("#highlight");
        const surface = document.querySelector("#surface");
        for (const node of [primary, highlight, surface]) node.style.borderRadius = radius;
        primary.style.background = palette.accent;
        primary.style.color = palette.accentFg;
        highlight.style.background = palette.highlight;
        highlight.style.color = palette.highlightFg;
        surface.style.background = "#fff";
        surface.style.color = palette.fg;
        surface.style.border = "1px solid color-mix(in srgb, " + palette.fg + " 12%, transparent)";

        document.querySelector("#command").textContent = command();
        const gitLabel = labelOf(GITS, state.git);
        const lintLabel = labelOf(LINTERS, state.linter);
        document.querySelector("#summary").textContent = `${palette.label} · ${lintLabel} · ${gitLabel}`;

        const invalid = nameError(state.name);
        nameInput.setAttribute("aria-invalid", invalid ? "true" : "false");
        if (invalid) nameInput.setAttribute("aria-describedby", "error");
        else nameInput.removeAttribute("aria-describedby");
        errorBar.hidden = !invalid;
        const suggestion = suggest(state.name);
        fixButton.textContent = `Use “${suggestion}”`;
        copyButton.disabled = Boolean(invalid);
        if (!copiedTimer) copyButton.textContent = "Copy command";
      }

      function edit(partial) {
        Object.assign(state, partial);
        state.preset = null;
        paint();
      }

      function applyPreset(id) {
        const preset = PRESETS[id];
        state.preset = id;
        state.palette = preset.palette;
        state.radius = preset.radius;
        state.font = preset.font;
        state.linter = preset.linter;
        state.git = preset.git;
        state.agents = preset.agents.slice();
        paint();
      }

      function mountCards() {
        const presets = document.querySelector("#presets");
        for (const [id, preset] of Object.entries(PRESETS)) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card";
          button.dataset.preset = id;
          button.innerHTML = `<strong></strong><span class="desc"></span>`;
          button.querySelector("strong").textContent = preset.label;
          button.querySelector(".desc").textContent = preset.detail;
          presets.append(button);
        }
        const palettes = document.querySelector("#palettes");
        for (const palette of PALETTES) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "card";
          button.dataset.palette = palette.id;
          const swatches = document.createElement("span");
          swatches.className = "swatches";
          swatches.setAttribute("aria-hidden", "true");
          for (const color of [palette.accent, palette.highlight, palette.danger]) {
            const dot = document.createElement("i");
            dot.style.background = color;
            swatches.append(dot);
          }
          const name = document.createElement("strong");
          name.textContent = palette.label;
          const detail = document.createElement("span");
          detail.className = "desc";
          detail.textContent = palette.detail;
          button.append(swatches, name, detail);
          palettes.append(button);
        }
        mountChips(document.querySelector("#radii"), RADII, "radius");
        mountChips(document.querySelector("#fonts"), FONTS, "font");
        mountChips(document.querySelector("#linters"), LINTERS, "linter");
        mountChips(document.querySelector("#gits"), GITS, "git");
        mountChips(document.querySelector("#agents"), AGENTS, "agent");
      }

      document.querySelector("#settings").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.preset) {
          applyPreset(button.dataset.preset);
          return;
        }
        if (button.dataset.palette) {
          edit({ palette: button.dataset.palette });
          return;
        }
        if (button.dataset.radius) {
          edit({ radius: Number(button.dataset.radius) });
          return;
        }
        if (button.dataset.font) {
          edit({ font: button.dataset.font });
          return;
        }
        if (button.dataset.linter) {
          edit({ linter: button.dataset.linter });
          return;
        }
        if (button.dataset.git) {
          edit({ git: button.dataset.git });
          return;
        }
        if (button.dataset.agent) {
          const id = button.dataset.agent;
          const on = state.agents.includes(id);
          if (on && state.agents.length === 1) return;
          const agents = on ? state.agents.filter((item) => item !== id) : [...state.agents, id];
          edit({ agents: AGENTS.map((item) => item.value).filter((item) => agents.includes(item)) });
        }
      });

      nameInput.addEventListener("input", () => {
        state.name = nameInput.value;
        clearTimeout(copiedTimer);
        copiedTimer = 0;
        paint();
      });

      fixButton.addEventListener("click", () => {
        const next = suggest(state.name);
        state.name = next;
        nameInput.value = next;
        paint();
        nameInput.focus();
      });

      copyButton.addEventListener("click", async () => {
        if (copyButton.disabled) return;
        const text = command();
        let copied = false;
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.append(area);
          area.select();
          try {
            copied = document.execCommand("copy");
          } catch {
            copied = false;
          }
          area.remove();
        }
        if (!copied) return;
        copyButton.textContent = "Copied ✓";
        clearTimeout(copiedTimer);
        copiedTimer = window.setTimeout(() => {
          copiedTimer = 0;
          copyButton.textContent = "Copy command";
        }, 1400);
      });

      mountCards();
      paint();
    </script>
  </body>
</html>
